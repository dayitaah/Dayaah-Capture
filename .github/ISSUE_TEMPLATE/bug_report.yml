name: Bug report
description: Report a reproducible problem. English and Spanish are welcome.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Dayaah Capture. Reports may be written in English or Spanish.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: capture_card
    attributes:
      label: Capture card
      placeholder: UGREEN 25173
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Selected video mode
      placeholder: 1920 x 1080 - 60 fps - NV12
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: Presentation mode
      options:
        - Minimum latency
        - VSync
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostic log
      description: Paste or attach DayaahCapture.log after reviewing it for private information.
